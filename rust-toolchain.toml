[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
# Linux hedefi yalnızca platformdan bağımsız crate'lerin (errors) derlendiğini denetlemek için
# (xtask check: linux-errors). Ürün Windows'ta çalışır.
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
profile = "minimal"
