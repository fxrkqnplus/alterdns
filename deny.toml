# AlterDNS — lisans ve tedarik zinciri politikası
# Kaynak: docs/research/THIRD_PARTY.md §0 ve CONTRIBUTING.md "Değişmez kurallar" 8.
# Yeni bir lisans eklemek THIRD_PARTY.md ve gerekiyorsa ADR güncellemesi ister.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
ignore = []
yanked = "deny"

[licenses]
# Tam SPDX kimlikleri (OSI onaylı, GPL-3.0-or-later ile uyumlu).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "Unicode-3.0",
    "CC0-1.0",
    # smoltcp (D8 adayı); OSI onaylı, GPL-3.0 ile uyumlu (kullanıcı kararı 2026-11-09).
    "0BSD",
]
confidence-threshold = 0.93
exceptions = []
# İzin listesi politikanın tamamıdır; henüz kullanılmayan lisanslar uyarı üretmesin.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
