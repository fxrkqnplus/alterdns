# AlterDNS — lisans ve tedarik zinciri politikası
# Kaynak: docs/research/THIRD_PARTY.md §0 ve CONTRIBUTING.md "Değişmez kurallar" 8.
# Yeni bir lisans eklemek THIRD_PARTY.md ve gerekiyorsa ADR güncellemesi ister.

[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
# Bakımsız olarak işaretlenmiş, güvenlik açığı bulunmayan ve düzeltme sürümü olmayan Slint
# bağımlılıkları (karar 2026-11-22). Her Slint güncellemesinde ve Faz 6'da yeniden
# değerlendirilir; açık (vulnerability) türündeki tavsiyeler istisna edilmez.
ignore = [
    { id = "RUSTSEC-2026-0543", reason = "chrono: i-slint-core'da zorunlu bağımlılık; açık değil, bakımsız" },
    { id = "RUSTSEC-2026-0441", reason = "pin-utils: spin_on üzerinden slint-build/slint-macros, yalnızca derleme zamanı; açık değil" },
]
yanked = "deny"

[licenses]
# Tam SPDX kimlikleri (OSI onaylı, GPL-3.0-or-later ile uyumlu).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "LGPL-3.0-only",
    "LGPL-3.0-or-later",
    "GPL-3.0-only",
    "GPL-3.0-or-later",
    "Unicode-3.0",
    # Slint arayüzünün pano bağımlılığı (clipboard-win, error-code); OSI onaylı, GPL-3.0 ile
    # uyumlu (2026-11-15, kapanış incelemesi S-11).
    "BSL-1.0",
    # smoltcp (D8 adayı); OSI onaylı, GPL-3.0 ile uyumlu (kullanıcı kararı 2026-11-09).
    "0BSD",
]
confidence-threshold = 0.93
exceptions = []
# İzin listesi politikanın tamamıdır; henüz kullanılmayan lisanslar uyarı üretmesin.
unused-allowed-license = "allow"

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
# Sürümsüz (`*`) bağımlılık yasak; yayımlanmayan yol bağımlılıkları serbest (S-11).
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
