[workspace]
resolver = "3"
members = ["xtask", "crates/*"]
# Spike'lar ürün kodu değildir; kendi Cargo.lock'larıyla ayrı derlenir.
exclude = ["spikes"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
authors = ["Furkan Okan"]
repository = "https://github.com/fxrkqnplus/alterdns"
publish = false

# Paylaşılan sürümler: her yeni sürüm eklenmeden önce `cargo info` ile doğrulanır.
[workspace.dependencies]
anyhow = "1.0.104"
proptest = "1.12.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
windows = "0.62.2"
# 0.6.x, `windows` 0.62 ile aynı alt crate'leri (link/result/strings) kullanır; 0.100 bunları çoğaltır.
windows-registry = "0.6.1"
winresource = "0.1.34"
alterdns-errors = { path = "crates/errors" }
alterdns-core = { path = "crates/core" }
alterdns-winsys = { path = "crates/winsys" }
alterdns-buildinfo = { path = "crates/buildinfo" }
alterdns-journal = { path = "crates/journal" }

[workspace.lints.rust]
# FFI crate'leri (winsys) `#[allow(unsafe_code)]` ile açar; diğerleri `#![forbid(unsafe_code)]` kullanır.
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
