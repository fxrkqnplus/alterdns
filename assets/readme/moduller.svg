<svg xmlns="http://www.w3.org/2000/svg" width="960" height="336" viewBox="0 0 960 336" role="img" aria-labelledby="t d">
  <title id="t">AlterDNS modülleri</title>
  <desc id="d">Üç modül: dosya güvenliği, tarayıcı koruması ve bağlantı yönetimi.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111B30"/>
    </linearGradient>
    <style>
      .card { fill: #121C31; stroke: #23304D; stroke-width: 1.5; }
      .title { font: 600 21px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #EEF3FB; }
      .sub { font: 500 12px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #8FA1C1; letter-spacing: 0.6px; }
      .item { font: 400 14px 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: #C9D5EA; }
    </style>
  </defs>
  <rect width="960" height="336" rx="22" fill="url(#bg)"/>

  <!-- Dosya güvenliği -->
  <g transform="translate(24 24)">
    <rect class="card" width="288" height="288" rx="16"/>
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#A78BFA" fill-opacity="0.16"/>
    <g fill="none" stroke="#C4B5FD" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 34h13l9 9v21a3 3 0 0 1-3 3H40a3 3 0 0 1-3-3V37a3 3 0 0 1 3-3z"/>
      <path d="M53 34v9h9"/>
      <circle cx="51" cy="55" r="5"/>
      <path d="M55 59l4 4"/>
    </g>
    <text class="sub" x="24" y="106">MODÜL 1</text>
    <text class="title" x="24" y="134">Dosya güvenliği</text>
    <g class="item">
      <circle cx="30" cy="171" r="3" fill="#A78BFA"/><text x="42" y="176">Dosyayı çalıştırmadan inceler</text>
      <circle cx="30" cy="203" r="3" fill="#A78BFA"/><text x="42" y="208">Arşiv ve gömülü içerikleri açar</text>
      <circle cx="30" cy="235" r="3" fill="#A78BFA"/><text x="42" y="240">Sandbox: AppContainer, Low IL</text>
      <circle cx="30" cy="267" r="3" fill="#A78BFA"/><text x="42" y="272">Güvenli · Şüpheli · Riskli</text>
    </g>
  </g>

  <!-- Tarayıcı koruması -->
  <g transform="translate(336 24)">
    <rect class="card" width="288" height="288" rx="16"/>
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#FBBF24" fill-opacity="0.15"/>
    <g fill="none" stroke="#FCD34D" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="35" y="35" width="30" height="24" rx="3"/>
      <path d="M35 41h30"/>
      <path d="M50 46l7 3v4c0 4-3 6.5-7 8-4-1.5-7-4-7-8v-4z"/>
    </g>
    <text class="sub" x="24" y="106">MODÜL 2</text>
    <text class="title" x="24" y="134">Tarayıcı koruması</text>
    <g class="item">
      <circle cx="30" cy="171" r="3" fill="#FBBF24"/><text x="42" y="176">MV3 uzantısı ve yerel köprü</text>
      <circle cx="30" cy="203" r="3" fill="#FBBF24"/><text x="42" y="208">Riskli adreste engelleme sayfası</text>
      <circle cx="30" cy="235" r="3" fill="#FBBF24"/><text x="42" y="240">Yerel itibar veritabanı</text>
      <circle cx="30" cy="267" r="3" fill="#FBBF24"/><text x="42" y="272">Mağaza yok, geliştirici modu</text>
    </g>
  </g>

  <!-- Bağlantı yönetimi -->
  <g transform="translate(648 24)">
    <rect class="card" width="288" height="288" rx="16"/>
    <rect x="24" y="24" width="52" height="52" rx="14" fill="#2DD4BF" fill-opacity="0.15"/>
    <g fill="none" stroke="#5EEAD4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="38" cy="50" r="4"/>
      <circle cx="62" cy="38" r="4"/>
      <circle cx="62" cy="62" r="4"/>
      <path d="M42 48l16-8M42 52l16 8"/>
    </g>
    <text class="sub" x="24" y="106">MODÜL 3</text>
    <text class="title" x="24" y="134">Bağlantı yönetimi</text>
    <g class="item">
      <circle cx="30" cy="171" r="3" fill="#2DD4BF"/><text x="42" y="176">Yerel DPI atlatma motoru</text>
      <circle cx="30" cy="203" r="3" fill="#2DD4BF"/><text x="42" y="208">Uzak VPN veya proxy yok</text>
      <circle cx="30" cy="235" r="3" fill="#2DD4BF"/><text x="42" y="240">Ağa göre teknik seçimi</text>
      <circle cx="30" cy="267" r="3" fill="#2DD4BF"/><text x="42" y="272">Başarısız ayar geri alınır</text>
    </g>
  </g>
</svg>
