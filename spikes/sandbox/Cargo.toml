[package]
name = "sandbox-spike"
description = "Faz 0 spike'ı (T-SPK-003): AppContainer + Low IL + Job Object + handle aktarımı"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Furkan Okan"]
publish = false

# Spike ana workspace'in dışındadır (kök Cargo.toml `exclude = ["spikes"]`); kendi kökü.
[workspace]

[dependencies]
anyhow = "1.0.104"
serde_json = "1.0.154"
sha2 = "0.11.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_Memory"] }
